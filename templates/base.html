<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nexora</title>
<style>
body{font-family:sans-serif;margin:0;background:#f4f6f8}
nav{background:#1f2937;color:#fff;padding:14px 24px;display:flex;justify-content:space-between}
nav a{color:#fff;margin-left:16px;text-decoration:none}
.box{max-width:900px;margin:30px auto;padding:0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:#fff;padding:28px;border-radius:10px;text-decoration:none;color:#111;box-shadow:0 1px 4px rgba(0,0,0,.1)}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{padding:10px 20px;background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
.err{color:#b91c1c}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.tag{padding:3px 10px;border-radius:12px;background:#e5e7eb;font-size:13px}textarea{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}.sm{padding:6px 12px;font-size:13px}.red{background:#b91c1c}</style>
</head>
<body>
<nav>
  <b>Nexora</b>
  <div>{% if session.user_id %}{{ session.role }} | {{ session.email }}<a href="/logout">Logout</a>{% endif %}</div>
</nav>
<div class="box">{% block content %}{% endblock %}</div>
</body>
</html>
